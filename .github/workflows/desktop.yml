# Builds the Windows desktop version (Electron). Run it by hand from the Actions tab, or push a tag like v1.4.0.
# The result is an artifact named "GlassArk-win" holding the unpacked app folder and a zip of it.
name: Build desktop (Windows)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: GlassArk-win
          path: |
            desktop/dist/*.zip
            desktop/dist/win-unpacked
          if-no-files-found: error
